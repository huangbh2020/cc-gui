<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mcode</title>
    <!--
      FOUC guard: the .dark class is applied to <html> BEFORE React mounts by
      initFoucGuard() in main.tsx (an external ESM module, so it passes the
      prod CSP `script-src 'self'`). We can't reach the persisted SQLite
      preference here (preload/IPC aren't ready yet), so we use the OS
      preference as a best-effort initial guess - which matches the default
      "system" theme. The renderer's useTheme() hook corrects this the moment
      it loads the real preference.
    -->
  </head>
  <body class="bg-surface text-content">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
