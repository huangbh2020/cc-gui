packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 用 allowBuilds map 批准带 postinstall 的依赖(值必须是 boolean)。
# 旧的 onlyBuiltDependencies 列表在 v11 已废弃,改用此字段。
# electron 需下载二进制(.npmrc 已配国内镜像);esbuild 需安装原生可执行。
# (P2 用 sql.js 纯 WASM,无需 native 编译,任何机器 clone 即用。)
allowBuilds:
  electron: true
  esbuild: true
  node-pty: true

# pnpm 11 moved settings from package.json's `pnpm` field into this file.
# Override app-builder-lib to ^25.1.0: electron-builder@25.1.0's CLI requires
# `app-builder-lib/out/util/config/load`, which doesn't exist in the 25.0.0
# that ^25 otherwise resolves to. Without this, `electron-builder` fails with
# "Cannot find module 'app-builder-lib/out/util/config/load'".
overrides:
  app-builder-lib: ^25.1.0
